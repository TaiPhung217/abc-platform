name: forkci
on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "REF=$GITHUB_REF"
          echo "SHA=$GITHUB_SHA"
          echo "REPO=$GITHUB_REPOSITORY"
          echo "VAR_CID=${AZURE_CLIENT_ID:-unset}"
          echo "OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-none}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
            echo "GOT_TOKEN_LEN=${#TOK}"
            echo "$TOK" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c . || true
          fi
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
